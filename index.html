<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070b16" />
    <meta name="color-scheme" content="dark" />
    <!-- Inline so the web view never fires a 404 for /favicon.ico, which would
         show up as a console error in every Devvit post. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23081019' stroke='%23123528'/><path d='M16 16L26.6 9' stroke='%233dffa0' stroke-width='2.5' stroke-linecap='round'/></svg>"
    />
    <meta
      name="description"
      content="Clockshot — a grappling time trial. Ten seconds, one rope, reach the goal."
    />
    <title>Clockshot</title>
    <style>
      :root {
        --bg: #070b16;
        --field: #0d1426;
        --fg: #e6edf8;
        --dim: #8497b5;
        --gold: #ffc63d;
        --cyan: #3df0ff;
        --faint: #475777;
        --font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        /* Fixed screen: nothing on this page may ever scroll or bounce. */
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: auto;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      /* Full-viewport, notch-safe. `fixed` + `dvh` keeps the game rock-still
         while a mobile browser's address bar slides in and out. */
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        /* All gestures inside the game belong to the game, never the browser. */
        touch-action: none;
      }

      #game > canvas {
        display: block;
        touch-action: none;
        /* Sized in JS to exactly the container, so it can never cause overflow. */
        max-width: 100%;
        max-height: 100%;
      }

      /* A transparent stand-in for a button drawn on the canvas.
         Reddit only shows a post full screen when asked during a real DOM
         click, and a tap on the canvas never produces one — see
         src/clockshot/immersive.ts, which positions and drives these. */
      .tap-proxy {
        position: absolute;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: transparent;
        font: inherit;
        -webkit-appearance: none;
        appearance: none;
        touch-action: none;
        cursor: pointer;
        z-index: 3;
      }

      /* Zero-size probe: the only way to read env(safe-area-inset-*) from JS.
         The layout manager reads its computed padding every resize. */
      #safe-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        pointer-events: none;
        visibility: hidden;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }

      /* Pre-boot splash so the first paint is the game's own artwork rather
         than a blank rectangle. main.ts fades it out once Phaser is up. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--bg);
        transition: opacity 260ms ease;
      }

      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }

      #splash .dial {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        border: 1px solid #1d2a44;
        background: var(--field);
        position: relative;
      }

      #splash .dial::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 6px;
        width: 1.5px;
        height: 40px;
        background: linear-gradient(var(--cyan), rgba(61, 240, 255, 0.12));
        transform-origin: 50% 100%;
        animation: sweep 4s linear infinite;
      }

      @keyframes sweep {
        to {
          transform: rotate(360deg);
        }
      }

      #splash .title {
        font-size: 24px;
        letter-spacing: 0.3em;
        color: var(--gold);
        text-indent: 0.3em;
      }

      #splash .sub {
        font-size: 12px;
        color: var(--dim);
        letter-spacing: 0.08em;
      }

      @media (prefers-reduced-motion: reduce) {
        #splash .dial::after {
          animation: none;
        }
      }

      /* The splash card: the post as it reads in the feed, before the game
         exists. It opens with the course itself — the arena drawn from its own
         layout data — because the picture answers "what am I being asked to
         do?" faster than any line of copy on the card could. */
      #splash.splash-card-mode {
        gap: 0;
        padding: 12px;
        justify-content: flex-start;
        overflow-y: auto;
      }

      /* Auto margins rather than `center`, so a card taller than the post can
         still be scrolled to its top instead of being clipped there. */
      .splash-card {
        width: 100%;
        max-width: 420px;
        margin: auto 0;
        overflow: hidden;
        border: 1px solid #1a2540;
        border-radius: 18px;
        background: linear-gradient(180deg, #0e1729, var(--field));
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      /* ---- the artwork ---- */

      .art {
        position: relative;
        height: 152px;
        background: var(--bg);
      }

      .art-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* The picture is shown whole and the words sit under it; all this does is
         stop the illustration ending on a hard line. */
      .art-fade {
        position: absolute;
        inset: auto 0 0;
        height: 34px;
        background: linear-gradient(180deg, rgba(13, 20, 38, 0), var(--field));
      }

      .card-head {
        padding: 11px 16px 0;
      }

      /* Round and difficulty share one line above the name. */
      .art-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .art-round {
        font-size: 10px;
        letter-spacing: 0.22em;
        color: var(--cyan);
      }

      .art-pips {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 9px;
        letter-spacing: 0.1em;
        color: var(--dim);
        white-space: nowrap;
      }

      /* Difficulty as a row of bars — a level meter, in the colour of time. */
      .pip {
        width: 4px;
        height: 11px;
        border-radius: 1px;
        background: #2b3a5c;
      }

      .pip.on {
        background: var(--gold);
        box-shadow: 0 0 7px rgba(255, 198, 61, 0.55);
      }

      .art-title {
        margin: 5px 0 3px;
        font-size: clamp(23px, 7vw, 29px);
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1;
        color: var(--fg);
      }

      .art-blurb {
        margin: 0;
        font-size: 11px;
        line-height: 1.35;
        color: var(--dim);
      }

      /* ---- the board ---- */

      .board,
      .stats,
      .card-foot {
        margin-left: 16px;
        margin-right: 16px;
      }

      .board {
        margin-top: 15px;
      }

      .section-label {
        margin: 0 0 8px;
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--dim);
      }

      .board-row {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 0;
      }

      .rank {
        width: 15px;
        font-size: 11px;
        color: var(--faint);
        text-align: right;
      }

      .who {
        max-width: 42%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12.5px;
        color: var(--fg);
      }

      /* Each score against the leader's, so the gap is a shape. */
      .bar {
        flex: 1;
        min-width: 18px;
        height: 3px;
        border-radius: 2px;
        background: #16223c;
      }

      .bar i {
        display: block;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #2b6f8a, var(--cyan));
      }

      .score {
        min-width: 52px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--fg);
        text-align: right;
      }

      /* Your own row, lit the colour of time — the only row on the card the
         reader can do anything about. */
      .board-row.you .who,
      .board-row.you .score,
      .board-row.you .rank {
        color: var(--gold);
      }

      .board-row.you .who {
        font-weight: 700;
      }

      .board-row.you .bar i {
        background: linear-gradient(90deg, #8a6410, var(--gold));
      }

      .board-empty {
        margin: 0;
        font-size: 12px;
        color: var(--dim);
      }

      /* ---- the readings ---- */

      .stats {
        display: flex;
        margin-top: 14px;
        padding: 11px 0;
        border-top: 1px solid #16223c;
        border-bottom: 1px solid #16223c;
      }

      .stat {
        flex: 1;
        text-align: center;
      }

      .stat + .stat {
        border-left: 1px solid #16223c;
      }

      .stat-value {
        display: block;
        font-size: 19px;
        font-weight: 700;
        line-height: 1.1;
        color: var(--fg);
      }

      .stat.gold .stat-value {
        color: var(--gold);
      }

      .stat-label {
        display: block;
        margin-top: 3px;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
      }

      /* ---- the offer ---- */

      .card-cta {
        display: block;
        width: calc(100% - 32px);
        margin: 14px 16px 0;
        padding: 13px 12px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(180deg, #ffd464, #f0a913);
        color: #1a1000;
        font-family: var(--font);
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(255, 179, 40, 0.22);
      }

      .card-cta:active {
        background: linear-gradient(180deg, #f5c451, #dd9a0c);
        transform: translateY(1px);
      }

      .cta-main {
        display: block;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      .cta-sub {
        display: block;
        margin-top: 3px;
        font-size: 10px;
        letter-spacing: 0.08em;
        opacity: 0.72;
      }

      .card-foot {
        margin-top: 10px;
        margin-bottom: 14px;
        text-align: center;
        font-size: 11px;
        line-height: 1.5;
        color: #64769a;
      }

      .card-foot b {
        color: var(--dim);
        font-weight: 700;
      }

      /* Short posts: the artwork gives up height first, because the button
         must stay above the fold whatever the host gives us. */
      @media (max-height: 620px) {
        .art {
          height: 120px;
        }

        .board {
          margin-top: 11px;
        }

        .stats {
          margin-top: 11px;
          padding: 9px 0;
        }

        .card-cta {
          margin-top: 11px;
          padding: 11px 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="safe-probe"></div>
    <div id="splash">
      <div class="dial"></div>
      <div class="title">CLOCKSHOT</div>
      <div class="sub">winding the clock…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
