<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070b16" />
    <meta name="color-scheme" content="dark" />
    <!-- Inline so the web view never fires a 404 for /favicon.ico, which would
         show up as a console error in every Devvit post. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23081019' stroke='%23123528'/><path d='M16 16L26.6 9' stroke='%233dffa0' stroke-width='2.5' stroke-linecap='round'/></svg>"
    />
    <meta
      name="description"
      content="Clockshot — a Reddit community time war. Swing, shoot, and bank seconds for your team."
    />
    <title>Clockshot</title>
    <style>
      :root {
        --bg: #070b16;
        --field: #0d1426;
        --fg: #e6edf8;
        --dim: #8497b5;
        --gold: #ffc63d;
        --cyan: #3df0ff;
        --font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        /* Fixed screen: nothing on this page may ever scroll or bounce. */
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: auto;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      /* Full-viewport, notch-safe. `fixed` + `dvh` keeps the game rock-still
         while a mobile browser's address bar slides in and out. */
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        /* All gestures inside the game belong to the game, never the browser. */
        touch-action: none;
      }

      #game > canvas {
        display: block;
        touch-action: none;
        /* Sized in JS to exactly the container, so it can never cause overflow. */
        max-width: 100%;
        max-height: 100%;
      }

      /* A transparent stand-in for a button drawn on the canvas.
         Reddit only shows a post full screen when asked during a real DOM
         click, and a tap on the canvas never produces one — see
         src/clockshot/immersive.ts, which positions and drives these. */
      .tap-proxy {
        position: absolute;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: transparent;
        font: inherit;
        -webkit-appearance: none;
        appearance: none;
        touch-action: none;
        cursor: pointer;
        z-index: 3;
      }

      /* Zero-size probe: the only way to read env(safe-area-inset-*) from JS.
         The layout manager reads its computed padding every resize. */
      #safe-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        pointer-events: none;
        visibility: hidden;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }

      /* Pre-boot splash so the first paint is the game's own artwork rather
         than a blank rectangle. main.ts fades it out once Phaser is up. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--bg);
        transition: opacity 260ms ease;
      }

      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }

      #splash .dial {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        border: 1px solid #1d2a44;
        background: var(--field);
        position: relative;
      }

      #splash .dial::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 6px;
        width: 1.5px;
        height: 40px;
        background: linear-gradient(var(--cyan), rgba(61, 240, 255, 0.12));
        transform-origin: 50% 100%;
        animation: sweep 4s linear infinite;
      }

      @keyframes sweep {
        to {
          transform: rotate(360deg);
        }
      }

      #splash .title {
        font-size: 24px;
        letter-spacing: 0.3em;
        color: var(--gold);
        text-indent: 0.3em;
      }

      #splash .sub {
        font-size: 12px;
        color: var(--dim);
        letter-spacing: 0.08em;
      }

      @media (prefers-reduced-motion: reduce) {
        #splash .dial::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="safe-probe"></div>
    <div id="splash">
      <div class="dial"></div>
      <div class="title">CLOCKSHOT</div>
      <div class="sub">winding the clock…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
